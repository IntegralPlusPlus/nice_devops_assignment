name: Deploy Serverless Stack

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OIDC

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-cdk-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Resolve notification email
        run: |
          EMAIL="${{ secrets.NOTIFICATION_EMAIL }}"
          echo "EMAIL_ARG=${EMAIL:+-c notification_email=$EMAIL}" >> "$GITHUB_ENV"

      - name: Synth Stack
        run: cdk synth NiceAssignmentStack $EMAIL_ARG

      - name: Deploy Stack
        run: |
          cdk deploy NiceAssignmentStack \
            --require-approval never \
            --outputs-file cdk-outputs.json \
            $EMAIL_ARG

      - name: Verify sample files were uploaded to S3
        run: |
          BUCKET=$(python -c "import json;print(json.load(open('cdk-outputs.json'))['NiceAssignmentStack']['BucketName'])")
          aws s3 ls "s3://$BUCKET" --recursive | tee objects.txt
          COUNT=$(wc -l < objects.txt)
          [ "$COUNT" -gt 0 ] || { echo "::error::Bucket is empty"; exit 1; }

      - name: Invoke Lambda (smoke test)
        run: |
          FN=$(python -c "import json;print(json.load(open('cdk-outputs.json'))['NiceAssignmentStack']['LambdaFunctionName'])")
          aws lambda invoke --function-name "$FN" \
            --cli-binary-format raw-in-base64-out \
            --payload file://events/test-event.json \
            --query 'FunctionError' --output text \
            response.json > function-error.txt
          cat response.json
          [ "$(cat function-error.txt)" = "None" ] || { echo "::error::Lambda failed"; exit 1; }

      - name: Write run summary
        if: always()
        run: |
          {
            echo "### Stack outputs"
            echo '```json'
            cat cdk-outputs.json 2>/dev/null || echo "(deploy did not complete)"
            echo '```'
            echo "### Lambda response"
            echo '```json'
            cat response.json 2>/dev/null || echo "(lambda was not invoked)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"